<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.45" stop-color="#17224f"/>
      <stop offset="1" stop-color="#2a1a54"/>
    </linearGradient>
    <radialGradient id="bloomRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8ab0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff8ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ebeff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5ebeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#785cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#785cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#base)"/>
  <ellipse cx="1990" cy="130" rx="1180" ry="740" fill="url(#bloomRose)"/>
  <ellipse cx="300" cy="350" rx="1080" ry="700" fill="url(#bloomCyan)"/>
  <ellipse cx="1280" cy="1600" rx="1440" ry="880" fill="url(#bloomViolet)"/>
  <rect width="2560" height="1600" fill="url(#vignette)"/>
  <rect width="2560" height="1600" filter="url(#grain)" opacity="0.05"/>
</svg>
