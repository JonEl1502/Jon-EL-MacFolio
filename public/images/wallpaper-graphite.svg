<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.5" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0f1216"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f7a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2c8f9e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3f5fa8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb0c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3fb0c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="180"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <path d="M -200 1500 C 500 1180, 900 1320, 1500 860 S 2300 420, 2800 260 L 2800 1700 L -200 1700 Z" fill="url(#sweep)"/>
  </g>
  <ellipse cx="2280" cy="240" rx="900" ry="620" fill="url(#glowIndigo)"/>
  <ellipse cx="420" cy="1420" rx="1000" ry="640" fill="url(#glowTeal)"/>
  <rect width="2560" height="1600" fill="url(#vignette)"/>
  <rect width="2560" height="1600" filter="url(#grain)" opacity="0.055"/>
</svg>
