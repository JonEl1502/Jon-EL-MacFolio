<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#25213f"/>
      <stop offset="0.5" stop-color="#191a33"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a6ff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#8a6ad0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8a6ad0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d7a" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#base)"/>
  <ellipse cx="560" cy="180" rx="1500" ry="1000" fill="url(#light)"/>
  <ellipse cx="2400" cy="1560" rx="1100" ry="700" fill="url(#warm)"/>
  <rect width="2560" height="1600" fill="url(#vignette)"/>
  <rect width="2560" height="1600" filter="url(#grain)" opacity="0.05"/>
</svg>
